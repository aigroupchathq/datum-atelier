<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATUM // Sovereign Automotive Atelier — Engineering Codex & Custodian Framework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Bespoke Horlogerie & Atelier Obsidian Palette */
      --void-bg: #05070B;
      --chassis-bg: #0A0D15;
      --module-bg: rgba(13, 18, 28, 0.92);
      --glass-panel: rgba(15, 21, 34, 0.88);
      
      /* Machined Metallics */
      --billet-aluminum: #E2E8F0;
      --satin-titanium: #94A3B8;
      --dark-graphite: #1E293B;
      --hairline-metal: rgba(255, 255, 255, 0.09);
      
      /* Heritage Marque Pigments */
      --cognac-gold: #E5A93C;
      --champagne-amber: #F59E0B;
      --amber-burn: #B45309;
      --amber-halo: rgba(229, 169, 60, 0.28);
      --racing-green: #10B981;
      --green-halo: rgba(16, 185, 129, 0.3);
      --caliper-red: #E11D48;
      --cobalt-cadence: #38BDF8;
      --cad-grid-line: rgba(255, 255, 255, 0.035);
      --cad-crosshair: rgba(229, 169, 60, 0.2);

      /* Node Tiers (Engineering CAD Specs) */
      --l1-accent: #E5A93C;
      --l1-border: rgba(229, 169, 60, 0.55);
      --l1-glow: 0 0 25px rgba(229, 169, 60, 0.2);

      --l2-accent: #E2E8F0;
      --l2-border: rgba(255, 255, 255, 0.12);

      --l3-accent: #38BDF8;
      --l3-border: rgba(56, 189, 248, 0.45);
      --l3-glow: 0 0 20px rgba(56, 189, 248, 0.2);

      --dashed-border: rgba(148, 163, 184, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--void-bg);
      color: var(--billet-aluminum);
    }

    /* ── CAD BLUEPRINT BACKGROUND GRID & CROSSHAIRS ── */
    .cad-canvas-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        linear-gradient(to right, var(--cad-grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--cad-grid-line) 1px, transparent 1px);
      background-size: 32px 32px, 160px 160px, 160px 160px;
      z-index: 0;
    }

    .cad-crosshairs {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient(var(--cad-crosshair) 2px, transparent 2px);
      background-size: 320px 320px;
      opacity: 0.6;
      z-index: 0;
    }

    /* ── TOP EXECUTIVE COCKPIT HUD ── */
    .cockpit-hud {
      position: fixed;
      top: 14px;
      left: 18px;
      right: 18px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      pointer-events: none;
    }

    .brand-binnacle {
      pointer-events: auto;
      background: var(--glass-panel);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--hairline-metal);
      border-radius: 14px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .marque-emblem {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .marque-logo {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.22em;
      background: linear-gradient(135deg, #FFF 0%, #D49020 60%, #E5A93C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .marque-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      color: var(--cognac-gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .live-telemetry-bar {
      display: none;
      align-items: center;
      gap: 16px;
      border-left: 1px solid var(--hairline-metal);
      padding-left: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: var(--satin-titanium);
    }

    @media (min-width: 1200px) {
      .live-telemetry-bar { display: flex; }
    }

    .telemetry-chip {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .telemetry-chip strong {
      color: var(--billet-aluminum);
      font-weight: 600;
    }

    .pulse-led {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--racing-green);
      box-shadow: 0 0 8px var(--green-halo);
      animation: pulse-ring 2.2s infinite ease-in-out;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    /* ── COCKPIT SWITCHES & CONTROLS ── */
    .hud-controls-cluster {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-panel);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--hairline-metal);
      border-radius: 14px;
      padding: 6px 12px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Bespoke Milled Machined Switch (Bespoke Journey Button) */
    .switch-journey {
      background: linear-gradient(180deg, #2A1F0D 0%, #150F05 100%);
      border: 1.5px solid var(--cognac-gold);
      color: var(--cognac-gold);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(229, 169, 60, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .switch-journey:hover {
      background: linear-gradient(180deg, #3D2D14 0%, #1F1709 100%);
      box-shadow: 0 6px 25px rgba(229, 169, 60, 0.45);
      transform: translateY(-1px);
    }

    .switch-journey:active {
      transform: translateY(1px);
    }

    .switch-journey.active {
      background: linear-gradient(180deg, #E5A93C 0%, #B45309 100%);
      color: #000;
      border-color: #FDE68A;
      box-shadow: 0 0 25px rgba(229, 169, 60, 0.6);
    }

    .mode-tab-group {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--hairline-metal);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .mode-tab {
      background: transparent;
      border: none;
      color: var(--satin-titanium);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-tab.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--billet-aluminum);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .machined-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--hairline-metal);
      color: var(--billet-aluminum);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .machined-btn:hover {
      border-color: var(--cognac-gold);
      color: var(--cognac-gold);
      background: rgba(229, 169, 60, 0.08);
    }

    .machined-btn:active {
      transform: scale(0.97);
    }

    /* Precision Search Field */
    .cad-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--hairline-metal);
      border-radius: 8px;
      padding: 6px 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .cad-search:focus-within {
      border-color: var(--cognac-gold);
      box-shadow: 0 0 15px var(--amber-halo);
    }

    .cad-search input {
      border: none;
      background: transparent;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--billet-aluminum);
      width: 140px;
    }

    /* ── SCENE & VIEWPORT ── */
    #viewport {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      overflow: hidden;
      z-index: 10;
    }

    #viewport.dragging {
      cursor: grabbing;
    }

    #scene {
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* ── SVG LASER TRACE CONNECTOR LINES ── */
    #connector-canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .laser-spline {
      fill: none;
      stroke: rgba(148, 163, 184, 0.22);
      stroke-width: 1.5px;
      stroke-dasharray: 4 4;
      transition: stroke 0.3s ease, stroke-width 0.3s ease, opacity 0.3s ease;
    }

    .laser-spline.active-trace {
      stroke: var(--cognac-gold);
      stroke-width: 2.2px;
      stroke-dasharray: none;
      filter: drop-shadow(0 0 8px var(--amber-halo));
    }

    .laser-spline.dimmed-trace {
      opacity: 0.12;
    }

    /* ── CAD BLUEPRINT COMPONENT CARDS (NON-GENERIC) ── */
    #nodes-layer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .cad-node {
      position: absolute;
      background: var(--module-bg);
      border: 1px solid var(--hairline-metal);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      white-space: nowrap;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.3s ease;
    }

    /* CAD Top Technical Label Bar */
    .cad-node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 7.5px;
      letter-spacing: 0.08em;
      color: var(--satin-titanium);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 3px;
      margin-bottom: 2px;
    }

    .cad-node-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cad-node-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .cad-node-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--satin-titanium);
    }

    /* Tier Stylings */
    .node-l0 {
      background: radial-gradient(circle at center, #1B2438 0%, #070A10 100%);
      border: 2px solid var(--cognac-gold);
      box-shadow: 0 15px 45px -5px rgba(229, 169, 60, 0.35), inset 0 0 25px rgba(229, 169, 60, 0.15);
      border-radius: 14px;
      padding: 16px 26px;
      align-items: center;
      text-align: center;
    }

    .node-l0 .root-wordmark {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.24em;
      background: linear-gradient(135deg, #FFF 0%, #D49020 60%, #E5A93C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .node-l0 .root-spec {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      color: var(--cognac-gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .node-l1 {
      border-color: var(--l1-border);
      color: #FFF;
      box-shadow: var(--l1-glow);
    }

    .node-l1 .cad-node-header {
      color: var(--cognac-gold);
    }

    .node-l1:hover {
      border-color: var(--champagne-amber);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 30px rgba(229, 169, 60, 0.4);
    }

    .node-l2 {
      border-color: var(--l2-border);
      color: var(--billet-aluminum);
    }

    .node-l2:hover {
      border-color: var(--satin-titanium);
      transform: translateY(-2px);
    }

    .node-l3 {
      border-color: var(--l3-border);
      background: rgba(14, 165, 233, 0.08);
      color: #E0F2FE;
      box-shadow: var(--l3-glow);
    }

    .node-l3:hover {
      border-color: #7DD3FC;
      transform: translateY(-2px);
    }

    .node-dashed {
      border: 1.5px dashed var(--dashed-border);
      background: rgba(15, 23, 42, 0.4);
      color: var(--satin-titanium);
      font-style: italic;
    }

    .cad-node.journey-focus {
      border-color: var(--cognac-gold) !important;
      outline: 2px solid var(--cognac-gold);
      outline-offset: 4px;
      box-shadow: 0 0 35px var(--amber-halo) !important;
      animation: cad-beacon 2s infinite ease-in-out;
      z-index: 80 !important;
    }

    @keyframes cad-beacon {
      0%, 100% { transform: scale(1.02); }
      50% { transform: scale(1.07); box-shadow: 0 0 50px rgba(229, 169, 60, 0.6) !important; }
    }

    .cad-node.journey-dim {
      opacity: 0.15;
      filter: grayscale(0.7);
    }

    /* ── 🌟 THE CUSTODIAN BESPOKE HOROLOGY COCKPIT (THE ANTI-GENERIC EXPERIENCE) ── */
    .custodian-cockpit {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(125%);
      z-index: 120;
      width: 94%;
      max-width: 860px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.95) 0%, rgba(10, 14, 22, 0.96) 100%);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1.5px solid var(--l1-border);
      border-radius: 20px;
      padding: 22px 26px;
      box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.8), 0 0 40px rgba(229, 169, 60, 0.25);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }

    .custodian-cockpit.open {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .cockpit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--hairline-metal);
      padding-bottom: 12px;
    }

    .act-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .act-stamp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--cognac-gold);
      background: rgba(229, 169, 60, 0.12);
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid rgba(229, 169, 60, 0.3);
      text-transform: uppercase;
    }

    .act-title {
      font-family: 'Cinzel', serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--billet-aluminum);
    }

    .cockpit-close {
      cursor: pointer;
      color: var(--satin-titanium);
      font-size: 15px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .cockpit-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFF;
    }

    /* Chapter Segment Bar */
    .cockpit-stepper {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .step-tick {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .step-tick.passed {
      background: var(--amber-burn);
    }

    .step-tick.current {
      background: var(--cognac-gold);
      box-shadow: 0 0 12px var(--amber-halo);
    }

    /* Cockpit Main Grid */
    .cockpit-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 860px) {
      .cockpit-grid { grid-template-columns: 1fr; }
    }

    .cockpit-narrative {
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--satin-titanium);
    }

    .cockpit-narrative strong {
      color: var(--billet-aluminum);
      font-weight: 600;
    }

    .cockpit-narrative em {
      color: var(--cognac-gold);
      font-style: normal;
      font-weight: 600;
    }

    /* Bespoke Physical Instrument Binnacle (Replaces Generic Form Controls) */
    .horology-binnacle {
      background: radial-gradient(circle at center, #111726 0%, #07090F 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 18px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .binnacle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.12em;
      color: var(--satin-titanium);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
    }

    /* ACT 1: ROTARY START SWITCH & FLIP COVER BUTTON */
    .ignition-cluster {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 16px;
      padding: 8px 0;
    }

    .rotary-bezel {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle, #1F293D 0%, #0D121D 100%);
      border: 3px solid #334155;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }

    .rotary-bezel:active {
      transform: scale(0.96);
    }

    .rotary-notch {
      width: 4px;
      height: 14px;
      background: var(--cognac-gold);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--cognac-gold);
      position: absolute;
      top: 6px;
    }

    .rotary-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 800;
      color: var(--billet-aluminum);
      text-align: center;
      line-height: 1.1;
      margin-top: 8px;
    }

    .flip-safety-switch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .safety-cover-btn {
      width: 110px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(180deg, #DC2626 0%, #991B1B 100%);
      border: 2px solid #F87171;
      color: #FFF;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .safety-cover-btn:hover {
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.6);
      transform: translateY(-1px);
    }

    .safety-cover-btn.fired {
      background: linear-gradient(180deg, #059669 0%, #047857 100%);
      border-color: #34D399;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
    }

      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.045);
      } catch (e) {}

          osc.frequency.setValueAtTime(70, now + i * 0.12);
          gain.gain.setValueAtTime(0.15, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.09);

        const fg = ctx.createGain();
        fire.type = 'triangle';

        fire.connect(fg);
        fg.connect(ctx.destination);
        fire.start(now + 0.42);
        fire.stop(now + 1.25);
      } catch (e) {}

    // ── GEOMETRY LAYOUT & ENGINE ──
    const NODE_WIDTH = 210;
    const NODE_HEIGHT = 44;
    const HORIZONTAL_GAP = 60;
    const VERTICAL_GAP = 18;
    const ROOT_WIDTH = 280;
    const ROOT_HEIGHT = 80;

    let nodePositions = new Map();
    let collapsedNodes = new Set();
    let selectedNodeId = null;

    let scale = 0.82;
    let panX = 140;
    let panY = 60;
    let isDragging = false;
    let startX, startY;

    const viewport = document.getElementById("viewport");
    const scene = document.getElementById("scene");
    const nodesLayer = document.getElementById("nodes-layer");
    const connectorCanvas = document.getElementById("connector-canvas");
    const searchInput = document.getElementById("searchInput");
    const radarCanvas = document.getElementById("radarCanvas");
    const radarCtx = radarCanvas.getContext("2d");
    const radarFrustum = document.getElementById("radarFrustum");

    function calculateLayout() {
      nodePositions.clear();

      const rootX = 60;
      const rootY = 620;
      nodePositions.set("root", {
        x: rootX,
        y: rootY,
        width: ROOT_WIDTH,
        height: ROOT_HEIGHT,
        data: SITEMAP_DATA
      });

      let branchY = 90;
      const L1_X = rootX + ROOT_WIDTH + 140;

      SITEMAP_DATA.children.forEach(l1 => {
        const isCollapsed = collapsedNodes.has(l1.id);
        const l1Height = calculateSubtreeHeight(l1);
        const l1CenterY = branchY + (l1Height / 2) - (NODE_HEIGHT / 2);

        nodePositions.set(l1.id, {
          x: L1_X,
          y: l1CenterY,
          width: NODE_WIDTH + 24,
          height: NODE_HEIGHT + 6,
          data: l1
        });

        if (!isCollapsed && l1.children) {
          layoutChildren(l1.children, L1_X + NODE_WIDTH + 24 + HORIZONTAL_GAP, branchY);
        }

        branchY += Math.max(l1Height + 36, NODE_HEIGHT + 36);
      });

      const positions = Array.from(nodePositions.values());
      const maxX = Math.max(...positions.map(p => p.x + p.width)) + 300;
      const maxY = Math.max(...positions.map(p => p.y + p.height)) + 300;
      connectorCanvas.setAttribute("width", maxX);
      connectorCanvas.setAttribute("height", maxY);

      drawRadar(maxX, maxY);
    }

    function calculateSubtreeHeight(node) {
      if (collapsedNodes.has(node.id) || !node.children || node.children.length === 0) {
        return NODE_HEIGHT;
      }
      let h = 0;
      node.children.forEach(child => {
        h += calculateSubtreeHeight(child) + VERTICAL_GAP;
      });
      return Math.max(h - VERTICAL_GAP, NODE_HEIGHT);
    }

    function layoutChildren(children, startX, startY) {
      let curY = startY;
      children.forEach(child => {
        const isCollapsed = collapsedNodes.has(child.id);
        const childHeight = calculateSubtreeHeight(child);
        const centerY = curY + (childHeight / 2) - (NODE_HEIGHT / 2);

        nodePositions.set(child.id, {
          x: startX,
          y: centerY,
          width: NODE_WIDTH,
          height: NODE_HEIGHT,
          data: child
        });

        if (!isCollapsed && child.children) {
          layoutChildren(child.children, startX + NODE_WIDTH + HORIZONTAL_GAP, curY);
        }

        curY += Math.max(childHeight + VERTICAL_GAP, NODE_HEIGHT + VERTICAL_GAP);
      });
    }

    // ── RENDER MAP & SPLINES ──
    function renderMap() {
      calculateLayout();
      nodesLayer.innerHTML = "";
      connectorCanvas.innerHTML = "";

      renderSplines(SITEMAP_DATA);

      const activeAct = isJourneyActive ? BESPOKE_ACTS[currentAct] : null;

      nodePositions.forEach((pos, id) => {
        const nodeEl = document.createElement("div");
        const d = pos.data;
        const hasKids = d.children && d.children.length > 0;
        const isCollapsed = collapsedNodes.has(id);

        let journeyCls = "";
        if (isJourneyActive && activeAct) {
          if (activeAct.focusNodes.includes(id)) {
            journeyCls = "journey-focus";
          } else {
            journeyCls = "journey-dim";
          }
        }

        if (d.type === "l0") {
          nodeEl.className = `cad-node node-l0 ${journeyCls}`;
          nodeEl.innerHTML = `
            <div class="root-wordmark">${d.label}</div>
            <div class="root-spec">${d.spec}</div>
          `;
        } else {
          nodeEl.className = `cad-node node-${d.type} ${journeyCls}`;
          nodeEl.innerHTML = `
            <div class="cad-node-header">
              <span>${d.code || 'SYS//NODE'}</span>
              <span>${d.route || ''}</span>
            </div>
            <div class="cad-node-main">
              <span class="cad-node-title">${d.label}</span>
              ${hasKids ? `<span class="cad-node-pill">${isCollapsed ? '+' : '−'}</span>` : ''}
            </div>
          `;
        }

        nodeEl.style.left = `${pos.x}px`;
        nodeEl.style.top = `${pos.y}px`;
        nodeEl.style.width = `${pos.width}px`;
        nodeEl.style.height = `${pos.height}px`;

        nodeEl.addEventListener("click", (e) => {
          e.stopPropagation();
          soundRelayClick();
          if (hasKids && d.type !== "l0") {
            if (collapsedNodes.has(id)) collapsedNodes.delete(id);
            else collapsedNodes.add(id);
            renderMap();
          }
        });

        nodesLayer.appendChild(nodeEl);
      });

      updateTransform();
    }

    function renderSplines(parent) {
      if (collapsedNodes.has(parent.id) || !parent.children) return;

      const pPos = nodePositions.get(parent.id);
      if (!pPos) return;

      const pRightX = pPos.x + pPos.width;
      const pCenterY = pPos.y + (pPos.height / 2);

      parent.children.forEach(child => {
        const cPos = nodePositions.get(child.id);
        if (!cPos) return;

        const cLeftX = cPos.x;
        const cCenterY = cPos.y + (cPos.height / 2);

        const midX = pRightX + (cLeftX - pRightX) * 0.5;
        const pathData = `M ${pRightX} ${pCenterY} C ${midX} ${pCenterY}, ${midX} ${cCenterY}, ${cLeftX} ${cCenterY}`;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathData);

        let cls = "laser-spline";
        if (isJourneyActive) {
          const act = BESPOKE_ACTS[currentAct];
          if (act.focusNodes.includes(parent.id) && act.focusNodes.includes(child.id)) {
            cls += " active-trace";
          } else {
            cls += " dimmed-trace";
          }
        } else if (parent.type === "l1") {
          cls += " active-trace";
        }

        path.setAttribute("class", cls);
        connectorCanvas.appendChild(path);

        renderSplines(child);
      });
    }

      panX = e.clientX - startX;

    });

      e.preventDefault();
      const z = e.deltaY < 0 ? 1.1 : 0.9;

      panX = e.clientX - (e.clientX - panX) * (newScale / scale);
      panY = e.clientY - (e.clientY - panY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }, { passive: false });

    function drawRadar(w, h) {
      radarBounds = { width: w, height: h };
      radarCanvas.width = 170;
      radarCanvas.height = 90;
      radarCtx.clearRect(0, 0, 170, 90);

      nodePositions.forEach(pos => {
        const rx = (pos.x / w) * 170;
        const ry = (pos.y / h) * 90;

        radarCtx.fillStyle = pos.data.type === "l1" || pos.data.type === "l0" ? "#E5A93C" : "rgba(255,255,255,0.3)";
        radarCtx.beginPath();
        radarCtx.arc(rx, ry, 2, 0, Math.PI * 2);
        radarCtx.fill();
      });

      updateRadar();
    }

    function updateRadar() {
      const rw = ((window.innerWidth / scale) / radarBounds.width) * 170;
      const rh = ((window.innerHeight / scale) / radarBounds.height) * 90;
      const rx = ((-panX / scale) / radarBounds.width) * 170;
      const ry = ((-panY / scale) / radarBounds.height) * 90;

      radarFrustum.style.width = `${Math.min(rw, 170)}px`;
      radarFrustum.style.height = `${Math.min(rh, 90)}px`;
      radarFrustum.style.left = `${Math.max(0, Math.min(rx, 170 - rw))}px`;
      radarFrustum.style.top = `${Math.max(0, Math.min(ry, 90 - rh))}px`;
    }

    // Keyboard controls
    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === "Escape") {
        if (isJourneyActive) toggleJourneyCockpit();
        searchInput.blur();
      }
      if (isJourneyActive) {
        if (e.key === "ArrowRight") stepAct(1);
        if (e.key === "ArrowLeft") stepAct(-1);
      }
    });

    // Boot
    window.addEventListener("DOMContentLoaded", () => {
      renderMap();
      resetView();

      const params = new URLSearchParams(window.location.search);
      if (params.get("journey") === "true") {
        const actParam = parseInt(params.get("act") || "1") - 1;
        setTimeout(() => {
          isJourneyActive = true;
          document.getElementById("custodianCockpit").classList.add("open");
          document.getElementById("journeyToggleBtn").classList.add("active");
          currentAct = Math.max(0, Math.min(4, actParam));
          renderCurrentAct();
        }, 400);
      }
    });
  </script>
</body>
</html>
